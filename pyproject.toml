# --- Project Configuration ---

[project]
name = "dt4lc-project"
dynamic = ["version"]
description = "Scalable Digital Twin Models for Land Cover Change Detection Using Machine Learning"
readme = "README.md"
requires-python = ">=3.10"

dependencies = ["numpy>=2.2.5", "torch>=2.6.0", "python-dotenv>=1.1.0"]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.6",
    "types-requests>=2.32.0.20250328",
    "watchdog>=6.0.0",
    "huggingface-hub>=0.30.2",
    "requests>=2.32.3",
    "types-pyyaml>=6.0.12.20250402",
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "ipdb>=0.13.13",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]
ui = ["streamlit>=1.44.1", "rasterio>=1.4.3", "matplotlib>=3.10.1"]
models = ["pyyaml>=6.0.2", "einops>=0.8.1", "timm>=1.0.15"]
api = ["fastapi>=0.115.6", "uvicorn>=0.32.1"]
agents = ["google-genai>=1.35.0,<2.0.0"]
server = ["uvicorn>=0.35.0,<1.0.0", "fastapi>=0.116.2,<1.0.0"]

[project.scripts]
cdt = "cognitive_ui.cli:run_app"
dt4lc-api = "server.cli:run"

# --- Build System ---

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognitive_ui", "digital_twin", "orchestrator", "dta", "server"]
include = ["cognitive_ui/py.typed", "digital_twin/py.typed"]

[tool.hatch.version]
path = "digital_twin/__init__.py"

# --- Linting and Formatting ---

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
no_site_packages = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["tests/", "build/", "scripts/"]

[tool.ruff]
line-length = 119
target-version = "py313"
extend-exclude = ["__pycache__", "build", "dist", ".git", ".mypy_cache", ".pytest_cache", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]
ignore = []

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["cognitive_ui", "digital_twin"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = [
    "-v",
    "-rfE",
    "--color=yes",
    "--durations=40",
    "--cov=senses",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--strict-markers",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
