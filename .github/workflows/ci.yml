name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run mypy
        run: uv run mypy dta server

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra server

      - name: Run tests
        run: uv run pytest tests/ -v --cov=dta --cov=server --cov-report=xml -m "not slow and not llm"
        env:
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""

      - name: Upload coverage to Codecov
        # Skip on fork PRs — they can't access CODECOV_TOKEN, so the upload
        # always fails (silently per fail_ci_if_error: false, but still
        # logs auth errors and shows a red step in the PR check summary).
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cognitive_ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cognitive_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        # -b: tsconfig.json has `files: []` and only references the app and node projects.
        run: npx tsc -b --noEmit

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cognitive_ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cognitive_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cognitive_ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cognitive_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  release-gate:
    name: Release gate
    # Pull requests into master come from dev (a release), from hotfix/* with a patch bump, or from
    # docs/* or ci/* with documentation, workflow (with their test) or deployment-kit (deploy/gcp)
    # changes only: the kit is operations, not part of the package.
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: dev, or a hotfix that bumps only the patch version
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          ver() { grep -oP '__version__\s*=\s*"\K[^"]+' "$@"; }
          if [ "$HEAD" = dev ]; then echo "a release from dev"; exit 0; fi
          case "$HEAD" in
            docs/*|ci/*)
              # Documentation, CI or deployment only: no version bump, and nothing that ships in the software.
              other=$(git diff --name-only origin/master...HEAD | grep -vE '(\.md$|^docs/|^CITATION\.cff$|^\.zenodo\.json$|^LICENSE$|^\.github/|^tests/test_release_workflow\.py$|^deploy/gcp/)' || true)
              if [ -n "$other" ]; then echo "::error::a docs/* or ci/* pull request may change documentation, workflow (with tests/test_release_workflow.py) and deploy/gcp files only; these are not: $other"; exit 1; fi
              echo "documentation, CI or deployment only"; exit 0 ;;
            hotfix/*) ;;
            *) echo "::error::pull requests into master come from dev (a release), hotfix/* (a patch), docs/* (documentation) or ci/* (workflows and the deployment kit); this one is from $HEAD"; exit 1 ;;
          esac
          base=$(git show origin/master:dta/__init__.py | ver -)
          head=$(ver dta/__init__.py)
          IFS=. read -r bM bm bp <<< "$base"
          IFS=. read -r hM hm hp <<< "$head"
          if [ "$hM" = "$bM" ] && [ "$hm" = "$bm" ] && [ "${hp%%[^0-9]*}" -gt "${bp%%[^0-9]*}" ]; then
            echo "hotfix: $base -> $head"
          else
            echo "::error::a hotfix bumps only the patch version: master has $base, this branch $head"; exit 1
          fi

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev --extra server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cognitive_ui/package-lock.json

      - name: Install Node dependencies
        working-directory: cognitive_ui
        run: npm ci

      - name: Build
        working-directory: cognitive_ui
        run: npm run build

      - name: Install Chromium headless shell
        working-directory: cognitive_ui
        run: npx playwright-core install --with-deps chromium-headless-shell

      - name: Run E2E smoke
        working-directory: cognitive_ui
        run: npm run e2e:smoke
        env:
          E2E_LLM: none

      - name: Upload E2E output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke
          path: cognitive_ui/tests/e2e/out/
